version: "3.9"

# ── Enterprise Agentic AI Platform — Docker Compose ──────────────────────────
# Full local dev stack: backend · frontend · PostgreSQL · Redis · Qdrant · Nginx

networks:
  ai_platform:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: aip_postgres
    environment:
      POSTGRES_DB: agentic_ai
      POSTGRES_USER: aip_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schemas:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks: [ai_platform]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aip_user -d agentic_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: aip_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks: [ai_platform]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Qdrant Vector Database ──────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: aip_qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    networks: [ai_platform]
    healthcheck:
      disable: true

  # ── Backend (FastAPI) ───────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: aip_backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://aip_user:${POSTGRES_PASSWORD:-changeme}@postgres:5432/agentic_ai
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks: [ai_platform]
    volumes:
      - ./apps/backend:/app/apps/backend:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Celery Worker ───────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: aip_worker
    command: celery -A apps.backend.workers.celery_app worker --loglevel=info --concurrency=4
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://aip_user:${POSTGRES_PASSWORD:-changeme}@postgres:5432/agentic_ai
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
    depends_on:
      - redis
      - postgres
    networks: [ai_platform]
    restart: unless-stopped

  # ── Frontend (Next.js) ──────────────────────────────────────────────────────
  frontend:
    build:
      context: apps/frontend
      dockerfile: ../../infrastructure/docker/Dockerfile.frontend
    container_name: aip_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost/ws
    ports:
      - "3000:3000"
    networks: [ai_platform]
    depends_on: [backend]
    restart: unless-stopped

  # ── Nginx Reverse Proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: aip_nginx
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on: [backend, frontend]
    networks: [ai_platform]
    restart: unless-stopped
